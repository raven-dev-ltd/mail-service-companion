name: Companion checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: CGO_ENABLED=0 go build -trimpath -o bin/mail-companion ./cmd/mail-companion
      - run: docker build --tag mail-service-companion:check .
